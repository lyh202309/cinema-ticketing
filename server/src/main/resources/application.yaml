server:
  port: 8081

spring:
  application:
    name: cinema-ticketing

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cinema_ticketing?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username:
    password:

  data:
    redis:
      host: localhost
      port:
      database:
      # password:

  rabbitmq:
    host: localhost
    port:
    username:
    password:
    virtual-host: /

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ===== 业务配置 =====
cinema:
  # DeepSeek API（AI 助手用，实现时填写）
  deepseek:
    api-key: ""
    base-url: https://api.deepseek.com
  # RAG 知识库（本地哈希向量，不需要任何 API key、不联网）
  rag:
    enabled: true          # false 则跳过知识库加载，AI 将无法回答规则类问题
    top-k: 4               # 每次检索召回的知识片段数
    min-coverage: 0.27     # 守门阈值：查询词覆盖率(0~1)，注意不是余弦相似度
                           # 余弦在「短问句 vs 长片段」下只有 0.10~0.25，且与相关性区间重叠，
                           # 标定不出可用阈值，故改用覆盖率。依据见 LocalHashEmbeddingModel#coverage
    dimension: 512         # 哈希向量维度
    rewrite-enabled: true  # 用 DeepSeek 做查询改写（多路召回），失败自动降级为单路
    rewrite-count: 3       # 生成几个检索变体
